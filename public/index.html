  document.title=lang==="ar"?"حاتم عطية | Hatem Attia":"Hatem Attia | حاتم عطية";
  $("#svc").innerHTML=SERVICES[lang].map(([h,p,li],i)=>`<article class="card"><div class="vis" aria-hidden="true">${ICONS[i]}</div><h3>${esc(h)}</h3><p>${esc(p)}</p><ul>${li.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></article>`).join("");
  $("#plans").innerHTML=PLANS[lang].map(([h,p,li,msg])=>`<article class="card plan"><h3>${esc(h)}</h3><div class="price">${esc(t.price)}</div><p>${esc(p)}</p><ul>${li.map(x=>`<li>${esc(x)}</li>`).join("")}</ul><a class="btn primary" style="margin-top:18px" target="_blank" rel="noopener" href="https://wa.me/${PROFILE.whatsapp.replace(/\D/g,"")}?text=${encodeURIComponent(msg)}">${esc(t.sub_cta)}</a></article>`).join("");
  const mt=$("#mailtxt"); mt.textContent=PROFILE.links.email; mt.href="mailto:"+PROFILE.links.email;
  $("#skl").innerHTML=SKILLS[lang].map(x=>`<span>${esc(x)}</span>`).join("");
  const box=$("#contacts"); box.innerHTML="";
  const L=PROFILE.links, names={training:t.training,linkedin:"LinkedIn",youtube:"YouTube",tiktok:"TikTok",instagram:"Instagram",facebook:"Facebook",github:"GitHub",email:t.email};
  const add=(label,href,primary)=>{const a=document.createElement("a");a.className="btn"+(primary?" primary":"");a.textContent=label;a.href=href;if(!href.startsWith("mailto:")){a.target="_blank";a.rel="noopener";}box.appendChild(a);};
  if(PROFILE.whatsapp) add(t.wa,"https://wa.me/"+PROFILE.whatsapp.replace(/\D/g,""),true);
  Object.keys(names).forEach(k=>{if(L[k]) add(names[k],k==="email"?"mailto:"+L[k]:L[k]);});
  const wa=$("#wa"); if(PROFILE.whatsapp){wa.href="https://wa.me/"+PROFILE.whatsapp.replace(/\D/g,"");wa.classList.remove("hidden");} else wa.classList.add("hidden");
}
$("#lang").onclick=()=>{lang=lang==="ar"?"en":"ar";try{localStorage.setItem("lang",lang)}catch(e){}render();};
$("#theme").onclick=()=>{const r=document.documentElement,d=r.dataset.theme==="dark"||(!r.dataset.theme&&matchMedia("(prefers-color-scheme:dark)").matches);r.dataset.theme=d?"light":"dark";};
render();
</script>
</body>
</html>
